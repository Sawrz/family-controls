[project]
name = "family-controls-web-checks"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pytest>=8.3,<10", "playwright>=1.55,<2", "pydantic>=2.11,<3",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "argon2-cffi>=23.1", "PyJWT[crypto]>=2.10,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../pkgs/family-controls/src"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
