# Used by both the NixOS module and the browser integration fixture.
root @assets@;
index index.html;
client_max_body_size 256k;
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cache-Control no-store always;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_ssl_server_name on;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate @ca@;
proxy_buffering off;
proxy_read_timeout 60s;

location = /web-config.json {
    alias @runtime@;
    default_type application/json;
}
# The browser first renders the callback route, then fetches this same URL as
# JSON. That second request carries the backend's path-scoped OIDC cookie.
location ~ ^/api/v1/auth/oidc/[a-zA-Z0-9_.-]+/callback$ {
    access_log off;
    error_page 418 =200 /200.html;
    if ($http_accept ~* "text/html") { return 418; }
    proxy_pass @backend@;
}
location /api/v1/auth/ {
    access_log off;
    proxy_pass @backend@;
}
location /api/ {
    proxy_pass @backend@;
}
location /_app/ {
    try_files $uri =404;
}
location / {
    try_files $uri $uri/ /200.html;
}
